BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bbappend"
BBFILE_COLLECTIONS += "phyflex_stm32mp2_m33"
BBFILE_PATTERN_phyflex_stm32mp2_m33 = "^${LAYERDIR}/"
BBFILE_PRIORITY_phyflex_stm32mp2_m33 = "100"
LAYERSERIES_COMPAT_phyflex_stm32mp2_m33 = "scarthgap"
LAYERDEPENDS_phyflex_stm32mp2_m33 = "core stm-st-stm32mp phytec"

# Avoid the existing devtool externalsrc and oe-local-files overrides.
# Its source checkout remains untouched.
BBMASK += ".*/workspace/appends/m33projects-stm32mp2[.]bbappend$"
